# Conjunto de avaliação da base (fase 1 do PLANO-ARQUITETURA.md).
#
# Cada pergunta tem um gabarito ancorado em IDs e em texto citado, nunca em número de linha:
#   - ancora: ID provisório no formato da fase 2 (br/cne-cp/res/2026/2#art71, cnct:..., curso:...);
#   - arquivo + trecho: onde o texto aparece literalmente hoje (o teste confere), para mapear depois;
#   - padroes: regex sobre a resposta normalizada (sem acentos, minúscula, "nº" vira "no", sem * e _).
# deve_conter conta se algum padrão casar; nao_deve_conter penaliza; conjunto aponta para o gabarito
# gerado por scripts/avaliacao/gabaritos/gerar.ts.
#
# status: curado (verificado na base local) | provisorio (depende de curadoria humana ou fase futura).
versao: 1

perguntas:
  # ------------------------------------------------------------------ núcleo do plano (Q1–Q8)
  - id: Q01
    origem: plano
    categoria: carga-horaria
    tipo: conjunto
    texto: >-
      A carga horária dos cursos técnicos em Informática integrados ao ensino médio do IFPR cumpre o
      mínimo da Resolução CNE/CP nº 2/2026 e do CNCT? Liste os cursos por campus.
    gabarito:
      status: provisorio
      resposta_esperada: >-
        São 18 cursos integrados da habilitação Técnico em Informática em oferta. O mínimo é de
        3.000 h no integrado (Res. CNE/CP nº 2/2026, art. 29, § 2º, com até 300 h de contabilização
        simultânea) e de 1.200 h para a habilitação no CNCT; no IFPR, a Res. CONSUP/IFPR nº 64/2022,
        art. 22, fixa 3.000 h em 3 anos e 3.200 h em 4 anos. As matrizes do SUAP registradas variam
        de 3.173 h a 3.600 h.
      deve_conter:
        - id: dcn-art29
          descricao: Cita o art. 29 da Res. CNE/CP nº 2/2026
          ancora: br/cne-cp/res/2026/2#art29-par2
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: deve-se atender a carga horária mínima de três mil horas
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*29(?!\d)'
        - id: minimo-3000
          descricao: Informa o mínimo de 3.000 horas do integrado
          ancora: br/cne-cp/res/2026/2#art29-par2
          padroes:
            - '3\.?000\s*(?:h\b|horas)'
            - 'tres mil horas'
        - id: cnct-1200
          descricao: Informa a carga horária mínima de 1.200 h do Técnico em Informática no CNCT
          ancora: cnct:tecnico-em-informatica
          arquivo: base-conhecimento/catalogos/cnct/cursos/tecnico-em-informatica.json
          trecho: '"carga_horaria_minima_horas": 1200'
          padroes:
            - '1\.?200\s*(?:h\b|horas)'
        - id: consup-64-2022
          descricao: Cita a Res. CONSUP/IFPR nº 64/2022 (art. 22), regra institucional do integrado
          ancora: ifpr/consup/res/2022/64#art22
          arquivo: base-conhecimento/normas/ifpr/resolucoes/RESOLUCAO_CONSUP-IFPR_64-2022_cursos-integrados.md
          trecho: mínimo de 3000 (três mil) horas para a duração total do curso
          padroes:
            - '64\s*/\s*2022'
      nao_deve_conter:
        - &res-1-2021-vigente
          id: res-1-2021-como-vigente
          descricao: Trata a Res. CNE/CP nº 1/2021 como vigente (foi revogada pelo art. 74, II, da Res. CNE/CP nº 2/2026)
          padroes:
            - '1\s*/\s*2021(?:(?!nao|revog|deixou|aplicav|matricul|transicao|conclu|ate )[^\n.]){0,60}\b(?:vigente|em vigor)\b'
      conjunto:
        arquivo: avaliacao/gabaritos/q01-integrados-informatica.json
      observacoes: >-
        Conjunto e âncoras normativas verificados. O veredito por curso (carga horária do PPC contra
        os mínimos) ainda depende de curadoria humana ou dos fatos de PPC cruzados com o SUAP (fase 6);
        por isso o gabarito é provisório. A carga do SUAP está em detalhes do conjunto.

  - id: Q02
    origem: plano
    categoria: busca-tematica-ppc
    tipo: conjunto
    texto: >-
      Quais PPCs da base ainda citam a Resolução CNE/CP nº 1/2021? Liste cada PPC com o campus e o
      nome do curso.
    gabarito:
      status: curado
      resposta_esperada: >-
        59 PPCs convertidos citam a Res. CNE/CP nº 1/2021 (41 técnicos e 18 de graduação), que foi
        revogada pela Res. CNE/CP nº 2/2026 (art. 74, II). Em 17 deles há também citação com o órgão trocado
        ("CNE/CEB nº 1/2021, que define as DCN ... da Educação Profissional"); em 1, só essa forma.
      deve_conter:
        - id: revogada
          descricao: Registra que a Res. CNE/CP nº 1/2021 foi revogada
          ancora: br/cne-cp/res/2026/2#art74-ii
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: a Resolução CNE/CP nº 1, de 5 de janeiro de 2021;
          padroes:
            - 'revogad'
      nao_deve_conter:
        - *res-1-2021-vigente
      conjunto:
        arquivo: avaliacao/gabaritos/q02-ppcs-citam-cne-cp-1-2021.json
      observacoes: >-
        Conjunto gerado pela heurística de scripts/avaliacao/gabaritos/citacoes.ts, conferida contra
        os casos de fronteira dos 202 PPCs (CNE/CP nº 5/2021, CNE/CEB nº 1/2021 sem contexto de EPT,
        quebras de OCR). Conta como citação a forma com órgão trocado (CNE/CEB) seguida de "educação
        profissional"; decidir na curadoria se essa contagem fica.
        Será refeito pelo resolvedor da fase 2.

  - id: Q03
    origem: plano
    categoria: citacao-dispositivo
    tipo: pontual
    texto: Que normas regem o estágio no curso Técnico em Enfermagem do IFPR?
    gabarito:
      status: curado
      resposta_esperada: >-
        Lei nº 11.788/2008 (Lei do Estágio); Res. CONSUP/IFPR nº 82/2022 (política de estágios do IFPR);
        Res. CNE/CP nº 2/2026, art. 37 (estágio na EPT, inclusive o limite de um terço no § 6º) e
        art. 28, XVII e § 1º, IV; e a legislação profissional indicada no CNCT (Lei nº 7.498/1986,
        Decreto nº 94.406/1987 e Resolução Cofen nº 609/2019).
      deve_conter:
        - id: lei-11788
          descricao: Cita a Lei nº 11.788/2008
          ancora: br/lei/2008/11788
          arquivo: base-conhecimento/normas/br/leis/LEI_BR_11788-2008_lei-estagio.md
          trecho: Estágio é ato educativo escolar supervisionado, desenvolvido no ambiente de trabalho
          padroes:
            - '11\.?788'
        - id: consup-82-2022
          descricao: Cita a Res. CONSUP/IFPR nº 82/2022
          ancora: ifpr/consup/res/2022/82
          arquivo: base-conhecimento/normas/ifpr/resolucoes/RESOLUCAO_CONSUP-IFPR_82-2022_politica-estagios.md
          trecho: Estabelecer a política de estágios do Instituto Federal de Educação, Ciência e Tecnologia do Paraná (IFPR)
          padroes:
            - '82\s*/\s*2022'
        - &dcn-2026
          id: dcn-2026
          descricao: Cita a Res. CNE/CP nº 2/2026
          ancora: br/cne-cp/res/2026/2
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: Define as Diretrizes Curriculares Nacionais para a Educação Profissional e Tecnológica.
          padroes:
            - '\b0*2\s*/\s*2026'
            - 'cne\s*/\s*cp\W{0,3}(?:n\.?\s?o?\.?\s*)?0*2,?\s+de\s+11\s+de\s+novembro\s+de\s+2026'
        - id: dcn-art37
          descricao: Cita o art. 37 da Res. CNE/CP nº 2/2026 (estágio profissional supervisionado)
          ancora: br/cne-cp/res/2026/2#art37
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: O estágio profissional supervisionado é ato educativo de responsabilidade e orientação da instituição de ensino
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*37(?!\d)'
        - id: lei-7498
          descricao: Cita a legislação profissional de enfermagem indicada no CNCT (Lei nº 7.498/1986)
          ancora: cnct:tecnico-em-enfermagem
          arquivo: base-conhecimento/catalogos/cnct/cursos/tecnico-em-enfermagem.json
          trecho: Lei nº 7.498, de 25 de junho de 1986
          padroes:
            - '7\.?498'
      nao_deve_conter:
        - *res-1-2021-vigente

  - id: Q04
    origem: plano
    categoria: vigencia
    tipo: conjunto
    texto: Que normas da base mudaram desde 01/01/2025 e o que isso impactou?
    gabarito:
      status: curado
      resposta_esperada: >-
        11 normas foram publicadas desde 01/01/2025. Impactos registrados na base: a Res. CNE/CP nº 2/2026
        revoga a Res. CNE/CP nº 1/2021 e o inciso III do art. 6º da Res. CNE/CEB nº 3/2025 (art. 74); a
        Lei nº 15.468/2026 acrescenta o § 9º-B ao art. 26 da LDB; a Res. CONSUP/IFPR nº 242/2025 altera a
        nº 8/2014 (regimento dos campi); a Res. CONSUP/IFPR nº 239/2025 revoga as Res. nº 11/2009 e
        53/2011; a Res. CONSUP/IFPR nº 271/2026 (Estatuto) revoga atos estatutários anteriores.
      deve_conter:
        - id: revoga-1-2021
          descricao: Aponta a revogação da Res. CNE/CP nº 1/2021
          ancora: br/cne-cp/res/2026/2#art74-ii
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: a Resolução CNE/CP nº 1, de 5 de janeiro de 2021;
          padroes:
            - 'revog[^\n]{0,160}1\s*/\s*2021'
            - '1\s*/\s*2021[^\n]{0,160}revog'
        - id: eja-art6-iii
          descricao: Aponta a revogação do inciso III do art. 6º da Res. CNE/CEB nº 3/2025
          ancora: br/cne-ceb/res/2025/3#art6-iii
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CEB_3-2025_diretrizes-eja.md
          trecho: (Revogado pela Resolução CNE/CP nº 2, de 11 de novembro de 2026)
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*6o?\b[^\n]{0,40}\biii\b'
            - '\binciso\s+iii\b[^\n]{0,40}\b(?:arts?\.?|artigos?)\s*6o?\b'
        - id: ldb-par9b
          descricao: Aponta o § 9º-B acrescido ao art. 26 da LDB pela Lei nº 15.468/2026
          ancora: br/lei/2026/15468
          arquivo: base-conhecimento/normas/br/leis/LEI_BR_15468-2026_educacao-politica-direitos-cidadania.md
          trecho: passa a vigorar acrescido do seguinte § 9º-B
          padroes:
            - '9o?\s*-\s*b\b'
            - '15\.?468[^\n]{0,160}\bldb\b'
        - id: regimento-8-2014
          descricao: Aponta a alteração da Res. CONSUP/IFPR nº 8/2014 (regimento dos campi)
          ancora: ifpr/consup/res/2025/242
          arquivo: base-conhecimento/normas/ifpr/resolucoes/RESOLUCAO_CONSUP-IFPR_242-2025_altera-regimento-interno-comum-campi.md
          trecho: Altera novamente dispositivos da Resolução CONSUP/IFPR nº 08/2014.
          padroes:
            - '\b0*8\s*/\s*2014'
      conjunto:
        arquivo: avaliacao/gabaritos/q04-normas-desde-2025.json
      observacoes: >-
        O conjunto (normas publicadas desde 01/01/2025) sai do manifest.json; as relações vêm do front
        matter (revoga, altera). A precisão não é avaliada, porque a resposta correta cita também as
        normas afetadas. A análise de impacto completa depende de relacoes.yaml e de kb impacto (fase 5).

  - id: Q05
    origem: plano
    categoria: busca-tematica-ppc
    tipo: conjunto
    texto: Como os PPCs dos cursos técnicos em Agropecuária tratam o acompanhamento de egressos?
    gabarito:
      status: curado
      resposta_esperada: >-
        Há 3 PPCs de Técnico em Agropecuária. O integrado de Ivaiporã (2024) tem a seção 4.3
        "Acompanhamento do egresso", vinculada à Política de Acompanhamento de Egressos do IFPR
        (Resolução IFPR nº 23/2021), com questionários às turmas concluintes e banco de dados de
        egressos. Os dois PPCs de Assis Chateaubriand (integrado de 2017 e subsequente de 2023) não têm
        seção nem mecanismo próprio de acompanhamento de egressos: "egresso" só aparece em sentido
        genérico (perfil, justificativa).
      deve_conter:
        - id: ivaipora-politica
          descricao: Cita a Política de Acompanhamento de Egressos do IFPR no PPC de Ivaiporã
          ancora: curso:ivaipora/tecnico-em-agropecuaria-integrado-ao-ensino-medio
          arquivo: base-conhecimento/institucional/ifpr/ppcs/ivaipora/tecnico-em-agropecuaria-integrado-ao-ensino-medio.md
          trecho: Política de Acompanhamento de Egressos do IFPR (Resolução IFPR nº 23, de 23 de julho de 2021)
          padroes:
            - 'politica de acompanhamento de egressos'
            - 'resolucao\s+(?:ifpr\s+)?(?:n\.?\s?o?\.?\s*)?23\b'
        - id: ivaipora-questionarios
          descricao: Menciona os questionários às turmas concluintes (instrumento do PPC de Ivaiporã)
          ancora: curso:ivaipora/tecnico-em-agropecuaria-integrado-ao-ensino-medio
          arquivo: base-conhecimento/institucional/ifpr/ppcs/ivaipora/tecnico-em-agropecuaria-integrado-ao-ensino-medio.md
          trecho: Aplicação de questionários para as turmas concluintes
          padroes:
            - 'questionario'
        - id: assis-sem-mecanismo
          descricao: Aponta que os PPCs de Assis Chateaubriand não têm mecanismo próprio de acompanhamento de egressos
          ancora: curso:assis-chateaubriand/tecnico-em-agropecuaria
          padroes:
            - '(?:\bnao\b|\bsem\b|ausencia|ausente|inexist|nenhum|omiss|lacuna)[^\n]{0,120}(?:acompanhamento|egress)'
      conjunto:
        arquivo: avaliacao/gabaritos/q05-ppcs-agropecuaria.json

  - id: Q06
    origem: plano
    categoria: busca-tematica-ppc
    tipo: pontual
    texto: Os PPCs técnicos do IFPR cobrem os incisos do art. 28 da Resolução CNE/CP nº 2/2026?
    gabarito:
      status: provisorio
      resposta_esperada: >-
        O art. 28 lista 18 elementos mínimos do PPC de EPTNM (I a XVIII, com o acompanhamento de egressos
        no XVIII e o § 4º). Os PPCs da base são anteriores à resolução (11/11/2026) e têm até dois anos
        para se adequar (art. 71). A cobertura por inciso varia por PPC e precisa ser medida seção a seção.
      deve_conter:
        - id: art28-18-elementos
          descricao: Indica que o art. 28 tem 18 incisos (I a XVIII)
          ancora: br/cne-cp/res/2026/2#art28
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: a metodologia e o cronograma de acompanhamento dos egressos do curso.
          padroes:
            - '\b18\b[^\n]{0,30}(?:incisos|elementos|itens|requisitos)'
            - '\bxviii\b'
        - &art71
          id: art71
          descricao: Cita o art. 71 da Res. CNE/CP nº 2/2026 (transição de dois anos)
          ancora: br/cne-cp/res/2026/2#art71
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: é assegurado período de transição de até dois anos, a partir da vigência desta Resolução
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*71(?!\d)'
        - id: ppcs-anteriores
          descricao: Observa que os PPCs convertidos são anteriores à resolução
          padroes:
            - 'anteriores?\s+a\s+(?:resolucao|norma|publicacao|2\s*/\s*2026|nova)'
            - '(?:elaborad|aprovad|redigid)[oa]s?\s+antes'
            - 'nenhum[^\n]{0,80}(?:cita|2\s*/\s*2026)'
      observacoes: >-
        A cobertura por inciso depende do índice de seções v2 com taxonomia do art. 28 (fase 4) ou de
        curadoria humana por PPC; até lá, só os elementos gerais da resposta são pontuados.

  - id: Q07
    origem: plano
    categoria: correspondencia
    tipo: pontual
    texto: Que dispositivo da Resolução CNE/CP nº 2/2026 corresponde ao art. 20 da Resolução CNE/CP nº 1/2021?
    gabarito:
      status: provisorio
      resposta_esperada: >-
        Candidato: o art. 22 da Res. CNE/CP nº 2/2026 ("Os cursos técnicos devem considerar os seguintes
        elementos em sua organização e oferta"), que retoma a lista do art. 20 da nº 1/2021 (base
        tecnológica, área tecnológica do eixo, atualização curricular, diálogo com o trabalho, relações
        sociais de produção, competências socioemocionais do § 2º), com acréscimos (IA, direitos humanos).
        Correspondência parcial.
      deve_conter:
        - id: art22
          descricao: Aponta o art. 22 da Res. CNE/CP nº 2/2026
          ancora: br/cne-cp/res/2026/2#art22
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: 'Os cursos técnicos devem considerar os seguintes elementos em sua organização e oferta:'
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*22(?!\d)'
        - id: origem-art20
          descricao: Identifica o conteúdo do art. 20 da Res. CNE/CP nº 1/2021
          ancora: br/cne-cp/res/2021/1#art20
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_1-2021_dcnept.md
          trecho: A estruturação dos cursos da Educação Profissional Técnica de Nível Médio, observados os princípios expressos no art. 3º, deve ainda considerar
          padroes:
            - 'base tecnologica'
            - 'estruturacao dos cursos'
      observacoes: >-
        Correspondência proposta pela leitura comparada dos dois textos, sem validação jurídica. A tabela
        de correspondência 1/2021 → 2/2026 (fase 5) exige leitura humana e pode classificar como parcial.

  - id: Q08
    origem: plano
    categoria: agregacao-institucional
    tipo: conjunto
    texto: >-
      Que campi ofertaram vagas em cursos técnicos do eixo Informação e Comunicação no Processo
      Seletivo 2026, e em que turno?
    gabarito:
      status: curado
      resposta_esperada: >-
        21 campi, com turnos conforme as ofertas do PS 2026 (ver detalhes do conjunto). Ex.: Curitiba
        oferta Telecomunicações (subsequente) no noturno; Foz do Iguaçu, Desenvolvimento de Sistemas
        no matutino.
      deve_conter:
        - id: turno-noturno
          descricao: Informa o turno noturno da oferta de Telecomunicações em Curitiba
          ancora: curso:curitiba/tecnico-em-telecomunicacoes
          arquivo: dados/institucional/ofertas/processo-seletivo-2026/curitiba-tecnico-em-telecomunicacoes-noturno.json
          trecho: 'Curitiba; Técnico em Telecomunicações; Turmas: 1; Turno: Noturno'
          padroes:
            - 'noturno'
        - id: turno-matutino
          descricao: Informa turnos diurnos (matutino), o mais comum nas ofertas do eixo
          ancora: curso:foz-do-iguacu/tecnico-em-desenvolvimento-de-sistemas
          arquivo: dados/institucional/ofertas/processo-seletivo-2026/foz-do-iguacu-tecnico-em-desenvolvimento-de-sistemas-matutino.json
          trecho: 'Foz do Iguaçu; Técnico em Desenvolvimento de Sistemas; Turmas: 1; Turno: Matutino'
          padroes:
            - 'matutino'
      conjunto:
        arquivo: avaliacao/gabaritos/q08-campi-eixo-informacao-comunicacao.json
      observacoes: >-
        O eixo de cada curso vem do casamento por nome com o CNCT (heurística até o cnct_id da fase 3).
        Os turnos têm 25 grafias nos editais; a padronização é da fase 3.

  # ------------------------------------------------------------------ uso real da base
  - id: Q09
    origem: uso-real
    categoria: citacao-dispositivo
    tipo: pontual
    texto: >-
      Qual o limite de carga horária do estágio supervisionado obrigatório num curso técnico de nível
      médio, segundo as DCN da EPT vigentes? Essa carga conta para atingir o mínimo do CNCT?
    gabarito:
      status: curado
      resposta_esperada: >-
        Não pode passar de um terço da carga horária mínima da habilitação no CNCT (Res. CNE/CP nº 2/2026,
        art. 37, § 6º), e é acrescida à carga horária mínima do curso, sem contar para atingi-la (art. 37, § 3º).
      deve_conter:
        - id: um-terco
          descricao: Informa o limite de um terço
          ancora: br/cne-cp/res/2026/2#art37-par6
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: não poderá ultrapassar a um terço da carga horária mínima prevista para a habilitação profissional estabelecida no CNCT
          padroes:
            - 'um terco'
            - '1\s*/\s*3\b'
            - '33(?:[,.]3+)?\s*%'
        - id: art37-par6
          descricao: Cita o art. 37, § 6º
          ancora: br/cne-cp/res/2026/2#art37-par6
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*37\b[^\n]{0,40}§\s*6(?!\d)'
