        Saúde, no CNCT), cuja oferta é exclusivamente presencial (Res. CNE/CP nº 2/2026, art. 49, § 8º).
        A descrição do CNCT que admite EaD com 50% presencial é anterior e não prevalece sobre a regra.
      deve_conter:
        - id: art49-par8
          descricao: Cita o art. 49, § 8º, da Res. CNE/CP nº 2/2026
          ancora: br/cne-cp/res/2026/2#art49-par8
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: será realizada exclusivamente no formato presencial
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*49\b[^\n]{0,40}§\s*8(?!\d)'
            - '§\s*8o?\s*,?\s*(?:do\s+)?(?:arts?\.?|artigos?)\s*49(?!\d)'
        - id: area-saude
