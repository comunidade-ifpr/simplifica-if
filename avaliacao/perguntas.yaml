  - id: Q17
    origem: uso-real
    categoria: fluxo-processual
    tipo: pontual
    texto: >-
      Pela Portaria PROENS/IFPR nº 121/2024, a adequação de um PPC técnico à Resolução CNE/CP nº 2/2026
      que aumente a carga horária é atualização ou ajuste curricular? É preciso esperar a integralização
      da matriz vigente?
    gabarito:
      status: curado
      resposta_esperada: >-
        É ajuste curricular, porque aumenta a carga horária (art. 30). Ajustes em regra só se implementam
        após a integralização da matriz (art. 34, § 1º), mas os derivados de alteração em diretrizes
        curriculares são exceção (art. 34, § 2º), então não é preciso esperar. O campus forma uma
        Comissão de Ajuste Curricular (CAJ, art. 34, § 3º) e a Diepex envia o processo à Proens (art. 35).
      deve_conter:
        - id: ajuste
          descricao: Classifica como ajuste curricular
          ancora: ifpr/proens/portaria/2024/121#art30
          arquivo: base-conhecimento/normas/ifpr/portarias/PORTARIA_PROENS-IFPR_121-2024_abertura-suspensao-extincao-cursos.md
          trecho: Ajustes curriculares se caracterizam como processos que impliquem o aumento ou diminuição da carga horária do curso
          padroes:
            - 'ajuste curricular'
            - '\be (?:um )?ajuste\b'
        - id: art30
          descricao: Cita o art. 30 da Portaria
          ancora: ifpr/proens/portaria/2024/121#art30
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*30(?!\d)'
        - id: excecao-art34-par2
          descricao: Aplica a exceção do art. 34, § 2º (alteração de diretrizes curriculares)
          ancora: ifpr/proens/portaria/2024/121#art34-par2
          arquivo: base-conhecimento/normas/ifpr/portarias/PORTARIA_PROENS-IFPR_121-2024_abertura-suspensao-extincao-cursos.md
          trecho: os ajustes derivados de adequações necessárias por força de alterações em diretrizes curriculares e outras legislações
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*34\b[^\n]{0,40}§\s*2(?!\d)'
            - '§\s*2o?\s*,?\s*(?:do\s+)?(?:arts?\.?|artigos?)\s*34(?!\d)'
        - id: caj
          descricao: Menciona a Comissão de Ajuste Curricular (CAJ)
          ancora: ifpr/proens/portaria/2024/121#art34-par3
          arquivo: base-conhecimento/normas/ifpr/portarias/PORTARIA_PROENS-IFPR_121-2024_abertura-suspensao-extincao-cursos.md
          trecho: o campus deverá formar uma Comissão de Ajuste Curricular (CAJ)
          padroes:
            - '\bcaj\b'
            - 'comissao de ajuste curricular'

