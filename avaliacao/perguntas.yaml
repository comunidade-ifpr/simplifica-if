  - id: Q10
    origem: uso-real
    categoria: vigencia
    tipo: pontual
    texto: >-
      A Resolução CNE/CP nº 1/2021 estava em vigor em 1º de outubro de 2026? E em 13 de novembro de 2026?
    gabarito:
      status: curado
      resposta_esperada: >-
        Em 01/10/2026, sim. Ela foi revogada pela Res. CNE/CP nº 2/2026 (art. 74, II), que entra em vigor
        na data de publicação (art. 75); a base registra provisoriamente 11/11/2026 e a data do DOU ainda
        precisa ser confirmada. Em 13/11/2026, portanto, está revogada se a publicação ocorreu até essa
        data, mas continua aplicável aos estudantes matriculados até a publicação (art. 71, parágrafo único).
      deve_conter:
        - id: art74
          descricao: Cita o art. 74 (revogação)
          ancora: br/cne-cp/res/2026/2#art74-ii
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: a Resolução CNE/CP nº 1, de 5 de janeiro de 2021;
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*74(?!\d)'
        - id: art75-publicacao
          descricao: Liga o início da vigência à data de publicação (art. 75)
          ancora: br/cne-cp/res/2026/2#art75
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: Esta Resolução entra em vigor na data de sua publicação.
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*75(?!\d)'
            - 'data de (?:sua )?publicacao'
        - id: matriculados-art71
          descricao: Ressalva o direito de conclusão dos matriculados (art. 71, parágrafo único)
          ancora: br/cne-cp/res/2026/2#art71-parunico
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: fica assegurado o direito de conclusão de seus cursos, com base na Resolução CNE/CP nº 1, de 5 de janeiro de 2021
          padroes:
            - 'matriculad'
        - id: dou-pendente
          descricao: Ressalva que a data de publicação no DOU não está confirmada na base
          ancora: br/cne-cp/res/2026/2
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: A data, a página do DOU e a URL oficial ainda precisam ser confirmadas
          padroes:
            - '\bdou\b'
            - 'diario oficial'
      observacoes: >-
        Depende da data do DOU (decisão em aberto 5 do plano). Se a publicação no DOU for posterior a
        13/11/2026, a segunda parte da resposta muda; atualize o gabarito quando a data for registrada.

  - id: Q11
    origem: uso-real
    categoria: impacto-revogacao
    tipo: pontual
    texto: >-
      Quais são os efeitos da revogação da Resolução CNE/CP nº 1/2021 para os cursos técnicos do IFPR
      que estão em oferta?
    gabarito:
      status: curado
      resposta_esperada: >-
        Todos os cursos técnicos (e superiores de tecnologia) autorizados e em oferta têm até dois anos,
        a partir da vigência da Res. CNE/CP nº 2/2026, para se adequar (art. 71, caput), e não só os que
        citam a norma de 2021. Os estudantes matriculados até a publicação podem concluir pela
        Res. nº 1/2021 (art. 71, parágrafo único). Os órgãos normativos editam normas complementares em
        até 180 dias (art. 73).
      deve_conter:
        - *art71
        - &dois-anos
          id: dois-anos
          descricao: Informa o prazo de dois anos de transição
          ancora: br/cne-cp/res/2026/2#art71
          padroes:
            - 'dois anos'
            - '\b2 anos'
        - id: matriculados-concluem
          descricao: Informa que os matriculados concluem pela Res. nº 1/2021 (art. 71, parágrafo único)
          ancora: br/cne-cp/res/2026/2#art71-parunico
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: fica assegurado o direito de conclusão de seus cursos
          padroes:
            - 'matriculad[^\n]{0,160}conclu'
            - 'conclu[^\n]{0,160}matriculad'
            - 'direito de conclusao'
        - id: art73-180-dias
          descricao: Menciona as normas complementares em até 180 dias (art. 73)
          ancora: br/cne-cp/res/2026/2#art73
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: no prazo de até cento e oitenta dias contados de sua publicação
          padroes:
