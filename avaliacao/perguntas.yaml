          ancora: br/cne-cp/res/2026/2#art49-par8
          padroes:
            - '(?:somente|exclusivamente|apenas|so)\s+(?:no formato\s+|na modalidade\s+|de forma\s+)?presencia'
            - '\bnao\b[^\n]{0,80}(?:semipresencial|a distancia|\bead\b)'

