  - id: Q22
    origem: uso-real
    categoria: impacto-revogacao
    tipo: pontual
    texto: >-
      Qual dispositivo da Resolução CNE/CEB nº 3/2025 (EJA) foi revogado pela Resolução CNE/CP nº 2/2026,
      e qual regra de carga horária vale agora para a EJA articulada ao ensino técnico de nível médio?
    gabarito:
      status: curado
      resposta_esperada: >-
        O inciso III do art. 6º da Res. CNE/CEB nº 3/2025, que fixava 2.400 h (revogado pelo art. 74, V,
        da Res. CNE/CP nº 2/2026). Vale o art. 30 da nº 2/2026: formação geral básica de no mínimo
        1.200 h mais a carga da habilitação técnica do CNCT (800, 1.000 ou 1.200 h), com até 300 h de
        contabilização simultânea, desde que haja integração curricular efetiva.
      deve_conter:
        - id: art6-iii
          descricao: Identifica o inciso III do art. 6º
          ancora: br/cne-ceb/res/2025/3#art6-iii
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CEB_3-2025_diretrizes-eja.md
          trecho: (Revogado pela Resolução CNE/CP nº 2, de 11 de novembro de 2026)
          padroes:
