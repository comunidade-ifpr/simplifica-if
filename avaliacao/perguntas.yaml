          descricao: Afirma que a adequação alcança todos os cursos técnicos autorizados e em oferta
          ancora: br/cne-cp/res/2026/2#art71
          padroes:
            - 'tod[oa]s os cursos'
            - 'todos os (?:\d+ )?(?:cursos )?tecnicos'
