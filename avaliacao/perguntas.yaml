  - id: Q23
    origem: uso-real
    categoria: correspondencia
    tipo: pontual
    texto: >-
      Que dispositivo da Resolução CNE/CP nº 2/2026 corresponde ao art. 26, § 1º, da Resolução CNE/CP
      nº 1/2021 (carga horária mínima dos cursos técnicos integrados ao ensino médio)?
    gabarito:
      status: provisorio
      resposta_esperada: >-
        Candidato: art. 29, § 2º, da Res. CNE/CP nº 2/2026 (mínimo de 3.000 h no integrado e no
        concomitante intercomplementar), complementado pelo § 3º (condições da contabilização simultânea
        de até 300 h). Correspondência parcial: a nº 1/2021 limitava a 1.800 h a BNCC; a nº 2/2026 admite
        300 h de contabilização simultânea.
      deve_conter:
        - id: art29-par2
          descricao: Aponta o art. 29, § 2º
          ancora: br/cne-cp/res/2026/2#art29-par2
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: deve-se atender a carga horária mínima de três mil horas
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*29\b[^\n]{0,40}§\s*2(?!\d)'
            - '§\s*2o?\s*,?\s*(?:do\s+)?(?:arts?\.?|artigos?)\s*29(?!\d)'
        - id: origem-art26-par1
          descricao: Reconhece o conteúdo de origem (3.000 h no integrado pela nº 1/2021)
          ancora: br/cne-cp/res/2021/1#art26-par1
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_1-2021_dcnept.md
          trecho: totalizará, no mínimo, 3.000 (três mil) horas, a partir do ano de 2021
          padroes:
            - '3\.?000\s*(?:h\b|horas)'
            - 'tres mil horas'
      observacoes: >-
        Correspondência proposta pela leitura comparada, sem validação jurídica (tabela 1/2021 → 2/2026
        da fase 5). No Markdown da nº 1/2021, o § 1º do art. 26 está partido por um heading espúrio
        "#### Art. 35-A" (citação à LDB), defeito a sanear na fase 5.

  - id: Q24
    origem: uso-real
    categoria: citacao-dispositivo
    tipo: pontual
    texto: O que as DCN da EPT vigentes exigem sobre o acompanhamento de egressos nos PPCs de cursos técnicos?
    gabarito:
      status: curado
      resposta_esperada: >-
        O PPC deve conter a metodologia e o cronograma de acompanhamento dos egressos (Res. CNE/CP nº 2/2026,
        art. 28, XVIII). O acompanhamento é sistemático, por mecanismo permanente que colete por pelo
        menos dois anos consecutivos após a conclusão dados de inserção profissional para atualizar o PPC,
        com proteção de dados conforme a LGPD (art. 28, § 4º).
      deve_conter:
        - id: art28-xviii
          descricao: Cita o inciso XVIII do art. 28
          ancora: br/cne-cp/res/2026/2#art28-xviii
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: a metodologia e o cronograma de acompanhamento dos egressos do curso.
          padroes:
            - '\bxviii\b'
        - id: art28-par4
          descricao: Cita o art. 28, § 4º
          ancora: br/cne-cp/res/2026/2#art28-par4
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: por pelo menos dois anos consecutivos, contados a partir da conclusão do curso
          padroes:
            - '\b(?:arts?\.?|artigos?)\s*28\b[^\n]{0,40}§\s*4(?!\d)'
            - '§\s*4o?\s*,?\s*(?:do\s+)?(?:arts?\.?|artigos?)\s*28(?!\d)'
        - *dois-anos
        - id: lgpd
          descricao: Menciona a proteção de dados (LGPD, Lei nº 13.709/2018)
          ancora: br/cne-cp/res/2026/2#art28-par4
          padroes:
            - '13\.?709'
            - '\blgpd\b'
            - 'protecao de dados'
      nao_deve_conter:
        - *res-1-2021-vigente

  - id: Q25
    origem: uso-real
    categoria: carga-horaria
    tipo: pontual
    texto: >-
      Um curso técnico subsequente presencial pode ter parte da carga horária em atividades não
      presenciais? Qual o limite, considerando as DCN da EPT e o CNCT?
    gabarito:
      status: provisorio
      resposta_esperada: >-
        Sim. A Res. CNE/CP nº 2/2026 admite até 30% da carga horária mínima em atividades síncronas,
        síncronas mediadas ou assíncronas, com mediação de professor (art. 28, § 2º), e exige ao menos 70%
        da carga horária total presencial (art. 50). As descrições do CNCT falam em até 20% da carga
        horária total não presencial; a diferença precisa ser apontada e resolvida na análise.
      deve_conter:
        - id: limite-30
          descricao: Informa o limite de 30% (art. 28, § 2º)
          ancora: br/cne-cp/res/2026/2#art28-par2
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: até o limite de 30% (trinta por cento) da carga horária mínima do curso
          padroes:
            - '30\s*%'
            - 'trinta por cento'
        - id: presencial-70
          descricao: Informa o mínimo de 70% presencial (art. 50)
          ancora: br/cne-cp/res/2026/2#art50
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: no mínimo, 70% (setenta por cento) da sua carga horária total por meio de atividades presenciais
          padroes:
            - '70\s*%'
            - 'setenta por cento'
        - id: cnct-20
          descricao: Aponta os 20% das descrições do CNCT
          ancora: cnct:tecnico-em-informatica
          arquivo: base-conhecimento/catalogos/cnct/cursos/tecnico-em-informatica.json
          trecho: poderá prever até 20% da sua carga horária total em atividades não presenciais
          padroes:
            - '20\s*%'
            - 'vinte por cento'
      observacoes: >-
        Qual limite prevalece (30% da carga mínima nas DCN ou 20% da carga total no CNCT) exige leitura
        normativa humana; por isso o gabarito é provisório e só pontua a presença dos três parâmetros.
