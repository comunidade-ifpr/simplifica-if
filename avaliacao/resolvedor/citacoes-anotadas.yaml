# Conjunto anotado para medir o resolvedor de citações.
#
# Contrato: esquemaCitacoesAnotadas em packages/kb/src/avaliacao/resolvedor.ts.
# Medição: pnpm exec vp test run packages/kb (avaliacao-resolvedor.test.ts) e `pnpm kb avaliar-resolvedor`.
#
# Seleção das linhas: 20 PPCs de campi, níveis e formas de oferta diferentes; em cada um, até 10
# linhas espaçadas entre as que têm "resolução", "lei", "decreto", "parecer", "portaria",
# "instrução normativa", "nota técnica", "LDB" ou "CNE/" e algum dígito (linhas de até 900
# caracteres). A seleção não usa o resolvedor; inclui linhas sem citação de ato (negativos).
#
# Anotação (feita por leitura, sem consultar a saída do resolvedor):
# - `trecho`: pedaço literal e único da linha no PPC (âncora; não se usa número de linha).
# - `ids`: conjunto dos atos citados na linha, com o ID canônico do ato (esteja ou não na base),
#   como um leitor humano o identifica com o contexto do PPC (ex.: "Resolução 50/2017" num PPC
#   do IFPR sobre avaliação é a Res. CONSUP/IFPR nº 50/2017). Um ato citado duas vezes na linha
#   conta uma vez. URL oficial do ato conta como citação dele. Dispositivo citado junto, quando
#   explícito, vai no sufixo `#...` (formato do plano); a medida de dispositivo é separada.
# - `sem_id`: menções a atos que não dá para identificar (portaria de campus, número de
#   processo SEI, ato sem número ou órgão indeterminável). Não contam para precisão nem recall,
#   mas o resolvedor não deve dar ID a elas: um ID emitido ali conta como falso positivo.
#
# Medidas, por par (linha, ato): precisão = pares emitidos com ID certo / pares emitidos com ID;
# recall = pares anotados encontrados / pares anotados.
#
# ATENÇÃO: o resolvedor foi ajustado olhando estas linhas, então os números medidos aqui são
# otimistas (conjunto de desenvolvimento). Para uma medida independente, anote outro conjunto.
