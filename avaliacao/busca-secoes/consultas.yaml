# Consultas temáticas rotuladas sobre seções de PPC (fase 6): medem a busca `kb buscar-secoes`.
#
# RASCUNHO, sem revisão humana. Rotulado por Claude lendo os títulos das seções dos PPCs (não o
# ranking da busca): para cada consulta, as seções que uma pessoa abriria para responder.
# Medida: `pnpm kb avaliar-busca [--json]` (recall@10 com e sem stemmer e sinônimos).
#
# Cada esperada é ancorada no PPC (`campus/curso`) e num trecho do título da seção (comparado sem
# acentos e sem caixa), nunca em número de linha. Uma esperada conta como achada se alguma seção do
# PPC com esse trecho no título aparece entre as 10 primeiras.
# recall@10 da consulta = achadas / min(esperadas, 10); a média é sobre as consultas.
#
# Filtros (iguais aos da CLI): ppc, cnct, campus, nivel, forma, tipo.

consultas:
