# Caso de avaliação da skill verificar-fundamentacao-normativa (M0.5 e M1.11 do plano do app).
#
# Pergunta: a skill melhora o resultado em relação a só o MCP `ifpr`? Cada documento sintético vai
# para uma pasta de trabalho vazia, com o mesmo pedido, em cada condição:
#   - sem-skill:     só o MCP `ifpr` (as instruções do servidor);
#   - skill:         MCP + a skill da árvore de trabalho (.agents/skills);
#   - skill-antiga:  MCP + a skill no commit `rev_skill_antiga` (antes do enxugamento).
# Roda com `node scripts/avaliar_skill.ts` (README em avaliacao/README.md, seção "Skills do app").
#
# Gabarito por alegação, ancorado em texto citado, nunca em número de linha:
#   - trecho: texto literal do documento (o teste confere);
#   - fonte.arquivo + fonte.trecho: onde a resposta certa aparece na base (o teste confere);
#   - status_aceitos: os status da skill que contam como acerto;
#   - padroes_alegacao: regex (texto normalizado) de que o relatório tratou da alegação;
#   - padroes_problema: regex de que o relatório apontou o problema certo (só em `erro`).
# O juiz (LLM, rubrica em scripts/avaliacao/skills.ts) lê o relatório e diz, por alegação, se ela foi
# tratada e qual status o relatório lhe deu; o acerto de status sai da comparação com status_aceitos.
versao: 1
skill: verificar-fundamentacao-normativa
rev_skill_antiga: 2ed08fd
pedido: >-
  Confira a fundamentação normativa do documento {arquivo}, que está nesta pasta.
documentos:
  - id: ppc-enfermagem
    arquivo: documentos/ppc-enfermagem-estagio.md
    alegacoes:
      - id: e1-carga-implicita
        tipo: erro
        erro_plantado: alegação implícita de carga horária, sem norma citada e com valor errado
        trecho: carga horária mínima de 1.000 horas exigida para a habilitação
        fonte:
          ancora: cnct:tecnico-em-enfermagem
          arquivo: base-conhecimento/catalogos/cnct/cursos/tecnico-em-enfermagem.json
          trecho: '"carga_horaria_minima_horas": 1200'
        explicacao: O CNCT fixa 1.200 horas para o Técnico em Enfermagem; o documento afirma 1.000 horas sem citar fonte.
        status_aceitos: [CONTRADITÓRIA, IMPRECISA, SEM SUPORTE NA FONTE]
        padroes_alegacao: ['1\.?000\s*(?:h\b|horas)']
        padroes_problema: ['1\.?200\s*(?:h\b|horas)']
      - id: e2-deve-pode
        tipo: erro
        erro_plantado: '"deve" onde a norma diz "pode"'
        trecho: o curso deve ofertar 30% da carga horária mínima em atividades a distância
        fonte:
          ancora: br/cne-cp/res/2026/2#art28-par2
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: pode prever carga horária de atividades síncronas, síncronas mediadas ou assíncronas
        explicacao: O art. 28, § 2º, faculta ("pode prever") até 30%; não obriga a ofertar 30%.
        status_aceitos: [IMPRECISA, CONTRADITÓRIA, SEM SUPORTE NA FONTE]
        padroes_alegacao: ['\b30\s*%', 'art(?:igo)?s?\.?\s*28']
        padroes_problema: ['pode prever', 'faculta', 'facultativ', 'ate (?:o limite de )?30', 'limite (?:maximo )?de 30', 'teto']
      - id: c1-estagio-obrigatorio-ou-nao
        tipo: correta
        trecho: pode ser obrigatório ou não obrigatório (Resolução CNE/CP nº 2/2026, art. 37, § 1º)
        fonte:
          ancora: br/cne-cp/res/2026/2#art37-par1
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: O estágio profissional supervisionado pode ser obrigatório ou não obrigatório.
        explicacao: Transcreve o art. 37, § 1º.
        status_aceitos: [CONFIRMADA, CONFIRMADA COM RESSALVA]
        padroes_alegacao: ['37,?\s*(?:§|par(?:agrafo)?\.?)\s*1(?!\d)']
      - id: c2-jornada
        tipo: correta
        trecho: não ultrapassará 6 (seis) horas diárias e 30 (trinta) horas semanais
        fonte:
          ancora: br/lei/2008/11788#art10-ii
          arquivo: base-conhecimento/normas/br/leis/LEI_BR_11788-2008_lei-estagio.md
          trecho: 6 (seis) horas diárias e 30 (trinta) horas semanais, no caso de estudantes do ensino superior, da educação profissional de nível médio
        explicacao: O art. 10, II, vale para a educação profissional de nível médio.
        status_aceitos: [CONFIRMADA, CONFIRMADA COM RESSALVA]
        padroes_alegacao: ['art(?:igo)?s?\.?\s*10\b', 'jornada', '30 (?:\(trinta\) )?horas semanais']
      - id: e3-terco-generalizado
        tipo: erro
        erro_plantado: regra do estágio obrigatório generalizada para o não obrigatório
        trecho: seja obrigatório ou não obrigatório, não poderá ultrapassar um terço
        fonte:
          ancora: br/cne-cp/res/2026/2#art37-par6
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: quando obrigatório, em cursos de EPTNM, em quaisquer das formas de oferta, não poderá ultrapassar a um terço
        explicacao: O limite de um terço do art. 37, § 6º, vale só para o estágio obrigatório.
        status_aceitos: [IMPRECISA, CONTRADITÓRIA, SEM SUPORTE NA FONTE, CONFIRMADA COM RESSALVA]
        padroes_alegacao: ['um terco', '1/3']
        padroes_problema:
          - 'quando obrigatorio'
          - '(?:so|somente|apenas|exclusivamente|restrit\w*)\b[^\n]{0,60}\bobrigatorio'
          - 'nao (?:se )?(?:aplica|alcanca|abrange)[^\n]{0,60}nao obrigatorio'
      - id: e4-ppc-como-obrigacao
        tipo: erro
        erro_plantado: PPC de outro campus usado como obrigação
        trecho: Conforme o PPC do Curso Técnico em Enfermagem do Campus Curitiba, é obrigatório que o estágio tenha no mínimo 400 horas.
        fonte:
          ancora: ppc:curitiba/tecnico-em-enfermagem
          arquivo: base-conhecimento/institucional/ifpr/ppcs/curitiba/tecnico-em-enfermagem.md
          trecho: 'Carga horária de Prática Profissional Supervisionada (estágio curricular): 400 horas'
        explicacao: O PPC de Curitiba prevê 400 horas para o próprio curso; PPC é exemplo institucional, não norma.
        status_aceitos: [NÃO NORMATIVA, SEM SUPORTE NA FONTE, IMPRECISA, CONTRADITÓRIA]
        padroes_alegacao: ['curitiba']
        padroes_problema:
          - 'nao (?:e|constitui|tem|possui) (?:uma )?(?:fonte |forca |carater )?(?:norma|normativ)'
          - 'exemplo institucional'
          - 'nao (?:obriga|vincula)'
          - 'nao e (?:fonte )?(?:de )?obrigacao'
  - id: parecer-informatica
    arquivo: documentos/parecer-informatica-integrado.md
    alegacoes:
      - id: c3-cnct-informatica
        tipo: correta
        trecho: carga horária mínima de 1.200 horas para a habilitação profissional, conforme o Catálogo Nacional de Cursos Técnicos
        fonte:
          ancora: cnct:tecnico-em-informatica
          arquivo: base-conhecimento/catalogos/cnct/cursos/tecnico-em-informatica.json
          trecho: '"carga_horaria_minima_horas": 1200'
        explicacao: O CNCT fixa 1.200 horas para o Técnico em Informática.
        status_aceitos: [CONFIRMADA, CONFIRMADA COM RESSALVA]
        padroes_alegacao: ['1\.?200\s*(?:h\b|horas)', 'cnct']
      - id: c4-integrado-3000
        tipo: correta
        trecho: atende ao mínimo de três mil horas exigido para a forma integrada pela Resolução CNE/CP nº 2/2026, art. 29, § 2º
        fonte:
          ancora: br/cne-cp/res/2026/2#art29-par2
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: deve-se atender a carga horária mínima de três mil horas
        explicacao: Transcreve o art. 29, § 2º.
        status_aceitos: [CONFIRMADA, CONFIRMADA COM RESSALVA]
        padroes_alegacao: ['art(?:igo)?s?\.?\s*29']
      - id: c5-consup-64
        tipo: correta
        trecho: devem ter no mínimo 3.000 horas, distribuídas em no mínimo 1.000 horas anuais (Resolução CONSUP/IFPR nº 64/2022, art. 22, inciso I, alínea a)
        fonte:
          ancora: ifpr/consup/res/2022/64#art22
          arquivo: base-conhecimento/normas/ifpr/resolucoes/RESOLUCAO_CONSUP-IFPR_64-2022_cursos-integrados.md
          trecho: mínimo de 3000 (três mil) horas para a duração total do curso, distribuídas em, no mínimo, 1000 (mil) horas anuais
        explicacao: Transcreve o art. 22, I, a.
        status_aceitos: [CONFIRMADA, CONFIRMADA COM RESSALVA]
        padroes_alegacao: ['64\s*/\s*2022']
      - id: e5-estagio-sempre-obrigatorio
        tipo: erro
        erro_plantado: '"obrigatório em todos" onde a norma diz "pode ser obrigatório ou não obrigatório"'
        trecho: O estágio profissional supervisionado é obrigatório em todos os cursos técnicos, nos termos do art. 37
        fonte:
          ancora: br/cne-cp/res/2026/2#art37-par2
          arquivo: base-conhecimento/normas/br/resolucoes/RESOLUCAO_CNE-CP_2-2026_dcnept.md
          trecho: será obrigatório quando assim determinado por lei, exigido pela natureza da ocupação ou definido pela instituição educacional
        explicacao: O art. 37, §§ 1º e 2º, admite estágio não obrigatório; ele só é obrigatório nas hipóteses do § 2º.
        status_aceitos: [CONTRADITÓRIA, IMPRECISA, SEM SUPORTE NA FONTE]
        padroes_alegacao: ['todos os cursos tecnicos']
        padroes_problema: ['pode ser obrigatorio ou nao obrigatorio', 'natureza da ocupacao', 'quando (?:assim )?determinado', 'definido pela instituicao']
      - id: e6-lei-revogada
        tipo: erro
        erro_plantado: norma revogada citada como vigente
        trecho: rege-se pela Lei nº 6.494/1977, em vigor
        fonte:
          ancora: br/lei/2008/11788#art22
          arquivo: base-conhecimento/normas/br/leis/LEI_BR_11788-2008_lei-estagio.md
          trecho: Revogam-se as Leis nºs 6.494, de 7 de dezembro de 1977
        explicacao: A Lei nº 6.494/1977 foi revogada pela Lei nº 11.788/2008, art. 22.
        status_aceitos: [CONTRADITÓRIA, IMPRECISA, SEM SUPORTE NA FONTE]
        padroes_alegacao: ['6\.?494']
        padroes_problema: ['revogad']
      - id: e7-artigo-errado
        tipo: erro
        erro_plantado: artigo errado de norma certa
        trecho: a concessão de bolsa e de auxílio-transporte é compulsória, conforme a Lei nº 11.788/2008, art. 9º
        fonte:
          ancora: br/lei/2008/11788#art12
          arquivo: base-conhecimento/normas/br/leis/LEI_BR_11788-2008_lei-estagio.md
          trecho: sendo compulsória a sua concessão, bem como a do auxílio-transporte, na hipótese de estágio não obrigatório
        explicacao: A regra está no art. 12 da Lei nº 11.788/2008; o art. 9º trata das obrigações da parte concedente.
        status_aceitos: [IMPRECISA, CONFIRMADA COM RESSALVA]
        padroes_alegacao: ['compulsori', 'auxilio-transporte']
        padroes_problema: ['art(?:igo)?s?\.?\s*12\b']
