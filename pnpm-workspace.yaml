packages:
  - apps/*
  - packages/*

# Uma versão só no monorepo. Ela acompanha a do T3 Code quando o código copiado dele depende dela
# (docs/upstream-t3.md), não automaticamente.
# `pnpm sync:repos` traz `.repos/effect` na tag de `effect` daqui.
catalog:
  "@effect/openapi-generator": 4.1.2
  "@effect/platform-node": 4.1.2
  "@effect/vitest": 4.1.2
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  effect: 4.1.3
  fflate: 0.8.3
  react: 19.3.0
  react-dom: 19.3.0
  remark-gfm: 4.0.1
  tailwindcss: 4.3.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  yaml: 2.9.1

# Copiados do T3: uma só cópia de vite, vite-plus, @types/node e effect no workspace; o
# @effect/vitest usa o vitest do Vite+ (patch abaixo), não um vitest próprio.
overrides:
  # Como no T3: o motor passa ao SDK o `claude` instalado pelo usuário, então os binários que o SDK
  # traz não são usados.
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-darwin-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-darwin-x64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-arm64-musl": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-x64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-linux-x64-musl": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-win32-arm64": "-"
  "@anthropic-ai/claude-agent-sdk>@anthropic-ai/claude-agent-sdk-win32-x64": "-"
  # O pdfjs-dist só usa o canvas para desenhar páginas; o @simplifica-if/pdf só extrai o texto.
  "pdfjs-dist>@napi-rs/canvas": "-"
  "@effect/platform-node": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"

# Como no T3: o patch faz o @effect/vitest importar vite-plus/test.
packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  "@effect/vitest@4.1.2": patches/@effect__vitest@4.1.2.patch

strictPeerDependencies: true

peerDependencyRules:
  allowAny:
    - typescript
    - vite
  allowedVersions:
    vite: "*"

# Como no T3: o Electron 44 não tem script de instalação (o `garantir-electron` do apps/desktop roda o
# install.js), e o electron-winstaller não é usado (o instalador do Windows é o NSIS).
allowBuilds:
  electron: false
  electron-winstaller: false

