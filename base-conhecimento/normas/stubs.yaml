# Normas citadas sem texto na base (stubs) e referências fora da base (externo:).
#
# Contrato: esquemaRegistroStubs em packages/kb/src/normas/registro.ts (Effect Schema), conferido por
# node scripts/validar_base.ts. Regras de ID em base-conhecimento/docs/padrao-front-matter-legislacao.md.
#
# - normas: atos do domínio (CNE, MEC, Presidência, IFPR) citados por PPCs ou fichas, sem texto na
#   base. Têm metadados, status e aliases, mas não têm dispositivos. Quando o texto entrar em
#   normas/, a entrada sai daqui (o validador acusa ID repetido).
# - externos: referências fora do escopo normativo da base (conselhos profissionais, ABNT,
#   documentos institucionais não normativos, regulamentos de campus).
#
# status_vigencia: vigente, alterada, revogada, parcialmente revogada ou "a confirmar".
# status_fonte: de onde veio o status. Só se marca status sem "a confirmar" quando há prova
# na própria base (dispositivo revogador publicado em normas/). Metadados escritos sem conferência
# em fonte oficial ficam com curadoria: rascunho.
#
# assinada_em (data do ato; no parecer, a aprovação no colegiado) e publicada_em (DOU ou Boletim de
# Serviço; no parecer, a publicação do despacho de homologação): cada uma só com evidência na fonte
# oficial, e datas_fonte, obrigatório com qualquer data, diz de onde vieram. O stub não tem
# vigente_de: a vigência dele começa na data do ato.
#
# fonte_url (URL https do texto oficial) e fonte_referencia (referência sem link): pelo menos um
# dos dois, como no front matter das normas. Fonte que não se acha não vira texto de pendência: o
# stub não entra.
#
# aliases: só nomes sem número que identificam o ato sem ambiguidade; citações com número e
# ano são reconhecidas pelo resolvedor (packages/kb/src/normas/resolver.ts) sem alias.

normas:
