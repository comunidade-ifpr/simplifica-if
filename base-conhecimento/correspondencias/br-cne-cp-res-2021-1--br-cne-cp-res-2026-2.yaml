# Tabela de correspondência: Res. CNE/CP nº 1/2021 (revogada) → Res. CNE/CP nº 2/2026 (fase 5).
#
# RASCUNHO. Proposta por leitura comparada dos dois textos da base, sem validação jurídica: a
# revisão humana é obrigatória antes de usar a tabela como fundamento de parecer (princípio 4 do
# plano de arquitetura). Ao revisar, troque `status` por `revisado` e registre quem revisou.
#
# Contrato: esquemaCorrespondencia em packages/kb/src/normas/correspondencia.ts (zod), conferido por
# bun run scripts/validar_base.ts (dispositivos existentes nos dois textos e todos os artigos da
# origem cobertos). Consulta: bun run kb correspondencia br/cne-cp/res/2021/1#art20
#
# Cada item: origem (dispositivo da 1/2021), tipo, destino (dispositivos da 2/2026; vazio em
# sem-equivalente) e nota.
#   equivalente: o destino trata do mesmo assunto com o mesmo efeito normativo (pode mudar a redação);
#   parcial: o destino trata do assunto, mas muda requisito, alcance, prazo ou valor (ver nota);
#   sem-equivalente: a 2/2026 não traz regra correspondente.
# Dispositivo sem item próprio herda o item do ancestral mais próximo (o do artigo, no mínimo).

origem: br/cne-cp/res/2021/1
destino: br/cne-cp/res/2026/2
status: rascunho
elaborado_em: "2026-11-13"
metodo: Leitura comparada, artigo por artigo, dos textos de base-conhecimento/normas; incisos e parágrafos detalhados nos artigos mais usados na análise de PPC técnico (16, 20, 24, 25 e 26).

