# Relações entre normas: fonte única (fase 5 do plano de arquitetura).
#
# Contrato: esquemaRelacoes em packages/kb/src/normas/relacoes.ts (Effect Schema), conferido por
# node scripts/validar_base.ts. O front matter das normas (revoga, revogada_por, altera,
# alterada_por, regulamenta, regulamentada_por, fundamenta_se_em, fundamenta) e o status_vigencia
# publicado são GERADOS daqui por node scripts/gerar_base.ts; não os edite à mão.
#
# Campos de cada relação:
#   tipo: revoga | altera | regulamenta | fundamenta-se-em
#   origem: ID do ato que opera a relação (norma da base ou stub de normas/stubs.yaml)
#   operador: dispositivo da origem que opera a relação (#art74-ii); obrigatório quando a origem tem
#     texto na base; o validador confere que ele existe
#   alvo: ID do ato atingido (norma da base ou stub)
#   alvo_dispositivo: dispositivo atingido (#art6-iii), quando a relação é parcial e o dispositivo
#     está no texto da base (o validador confere)
#   alcance: texto curto do que foi atingido quando o dispositivo não está no texto da base
#     (relação parcial: "§ 1º do art. 6º do Regimento (anexo)")
#   efeito_de: vigencia-da-origem (padrão: vigente_de da origem) ou data AAAA-MM-DD
#   evidencia: { em: ID (com dispositivo) do texto da base que prova a relação, trecho: texto
#     literal contido nele }; o validador confere que o trecho está no dispositivo
#   confirmado_em: data da confirmação humana no texto
#   proposta: front-matter (par migrado do front matter antigo) | regex (proposta de
#     `kb relacoes --propor`, confirmada no texto) | manual
#   nota: observação
#
# Regras de vigência (packages/kb/src/normas/vigencia.ts): revoga sem alvo_dispositivo nem alcance
# revoga o ato inteiro; com eles, é revogação parcial. altera marca o alvo como alterado.
# regulamenta e fundamenta-se-em não mudam o status, mas entram em `kb impacto`.
#
# descartadas: propostas do regex que NÃO viraram relação, com o motivo. `kb relacoes --propor`
# só lista o que não está nem em relacoes nem em descartadas.

