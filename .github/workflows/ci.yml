# Integração contínua.
#
# - verificacao (Linux x64): formatação, lint, tipos, testes (os de navegador do apps/web no Chromium
#   headless do Playwright), banco, smoke do MCP contra a base real, validação da base e os gabaritos
#   que não dependem do macOS.
# - executavel (macOS arm64, Linux x64, Windows x64): o executável simplifica-mcp no runner nativo,
#   as suítes "sem repositório", "determinismo" e "pasta de trabalho" contra ele, e o executável como
#   artefato.
#
# Sem segredos.
# Os checkouts pulam .repos/ (código de referência do Effect, versionado), como no T3 Code.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Verificação (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/preparar

      - name: Formatação
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      # Os testes de navegador do apps/web (projeto `navegador`) rodam no Chromium headless do
      # Playwright. Como no T3: só o headless shell, em cache pela versão do Playwright, e as
      # bibliotecas do sistema só se faltar alguma.
      - name: Versão do Playwright
        id: playwright
        run: echo "versao=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache do Chromium
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.versao }}

      - name: Chromium dos testes de navegador
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Bibliotecas do sistema que faltarem ao Chromium
        run: |
          navegador=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$navegador"
          if ldd "$navegador" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      # Antes dos testes: os do `packages/ppc` leem a base da revisão do `tmp/kb.sqlite`, como o app.
      - name: Compila o kb.sqlite
        run: pnpm kb compilar

      - name: Testes
        run: pnpm test

      - name: Testes sobre a base completa (PPCs)
        run: pnpm test:base

      - name: Testes de navegador (Playwright)
        run: pnpm test:browser

      - name: Smoke do MCP (suítes transversais na base real)
        run: pnpm mcp:smoke

      - name: Valida a base
        run: node scripts/validar_base.ts

      - name: Índice de PPCs em dia
        run: node scripts/gerar_indice_ppcs.ts --check

  executavel:
    name: Executável (${{ matrix.alvo }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - alvo: darwin-arm64
            runner: macos-15
          - alvo: linux-x64
            runner: ubuntu-24.04
          - alvo: win-x64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Fins de linha como no repositório
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/preparar

      - name: Constrói o executável
        run: pnpm mcp:executavel

      - name: Caminho do executável
        run: |
          nome=$(cd packages/mcp/dist-exe && ls simplifica-mcp*)
          echo "SIMPLIFICA_MCP_EXE=${GITHUB_WORKSPACE}/packages/mcp/dist-exe/${nome}" >> "$GITHUB_ENV"

      - name: Sem repositório, determinismo e pasta de trabalho, contra o executável
        working-directory: packages/mcp
        run: >-
          pnpm exec vp test run --config ../../vite.config.ts --dir .
          test/transversal/sem-repositorio.test.ts test/transversal/determinismo.test.ts
          test/transversal/pasta-de-trabalho.test.ts

      - name: Publica o executável
        uses: actions/upload-artifact@v4
        with:
          name: simplifica-mcp-${{ matrix.alvo }}
          path: packages/mcp/dist-exe/
          if-no-files-found: error
          retention-days: 14
