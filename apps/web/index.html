<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Simplifica IF</title>
    <script>
      // O tema antes do React, para não piscar (o mesmo critério de src/tema.ts).
      (() => {
        let preferencia = null;
        try {
          preferencia = window.localStorage.getItem("simplifica-if:tema");
        } catch {}
        const escuro =
          preferencia === "escuro" ||
          (preferencia !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (escuro) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
